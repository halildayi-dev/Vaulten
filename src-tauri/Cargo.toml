[package]
name = "vaulten"
version = "0.1.0"
description = "Vaulten local-first password manager"
edition = "2021"

[lib]
name = "vaulten_lib"

[build-dependencies]
tauri-build = "2.7"

[dependencies]
tauri = "2.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.6"
chacha20poly1305 = "0.11"
rand = "0.10"
zeroize = "1.9"
secrecy = "0.10"
unicode-normalization = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1.29", features = ["v4"] }
arboard = "3.7"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
